# Render Blueprint for the MarSU dashboard API.
# Set secret values in Render's dashboard or environment groups; do not commit them.
services:
  - type: web
    name: marsu-executive-dashbaord
    runtime: node
    branch: security-testing
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://marsu-executive-dashbaord.vercel.app
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: RATE_LIMIT_MAX
        value: "300"
      # --- Empower AI Chatbot ---
      - key: AI_PROVIDER
        value: glm
      - key: sk-Eg7N7qEWKV0zzBTQxXdHqEsa4d2eda8PRMevW6cdyVI9bRxo
        sync: false
      - key: AI_MODEL
        value: glm-5.3
      - key: AI_MAX_TOOL_HOPS
        value: "5"
      - key: CHAT_RATE_LIMIT_MAX
        value: "20"
