# Render Blueprint for the MarSU dashboard API.
# Set secret values in Render's dashboard or environment groups; do not commit them.
# After editing, deploy via: Render Dashboard > Blueprint > Sync or Manual Deploy.
services:
  - type: web
    # NOTE: keep this exact name (typo included) — Render derives the public
    # onrender.com subdomain from it, and the deployed frontend's VITE_API_URL
    # points to https://marsu-executive-dashbaord.onrender.com.
    name: marsu-executive-dashbaord
    runtime: node
    branch: security-testing
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      # --- Secrets (set in Render dashboard, sync: false) ---
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      # --- Non-secret configuration ---
      - key: CORS_ORIGINS
        value: https://marsu-executive-dashbaord.vercel.app
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: RATE_LIMIT_MAX
        value: "300"
      # --- Empower AI Chatbot ---
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.6-flash
      # AI_BASE_URL is optional for gemini — the SDK defaults to the correct endpoint
      - key: AI_MAX_TOOL_HOPS
        value: "5"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "4000"
      - key: AI_TEMPERATURE
        value: "0.2"
      - key: AI_TIMEOUT_MS
        value: "60000"
      # If no stream chunk arrives within this window, abort to avoid hanging.
      - key: AI_STREAM_IDLE_MS
        value: "30000"
      - key: AI_USER_AGENT
        value: roo-code/1.0
      - key: CHAT_RATE_LIMIT_MAX
        value: "20"
